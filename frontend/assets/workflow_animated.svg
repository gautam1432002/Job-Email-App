<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="700">
  <defs>
    <!-- Background Gradient (Whiter, modern) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Liquid Glass Shadow & Blur (Glassmorphism) -->
    <filter id="glass" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <!-- Glowing Blue Dot Beams (Arrows) -->
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6" />
    </marker>

    <style>
      .bg-blob { fill: #E0E7FF; filter: blur(60px); opacity: 0.8; }
      .bg-blob-pink { fill: #FCE7F3; filter: blur(60px); opacity: 0.8; }
      
      .glass-card { fill: rgba(255, 255, 255, 0.7); stroke: rgba(255, 255, 255, 1); stroke-width: 3; rx: 24; filter: url(#glass); }
      
      .title { font-family: -apple-system, system-ui, sans-serif; font-weight: 800; font-size: 24px; fill: #1E293B; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, system-ui, sans-serif; font-weight: 600; font-size: 15px; fill: #64748B; }
      .desc { font-family: -apple-system, system-ui, sans-serif; font-weight: 500; font-size: 14px; fill: #94A3B8; }
      
      .beam { fill: none; stroke: #3B82F6; stroke-width: 4; stroke-dasharray: 8 8; stroke-linecap: round; animation: flowBeam 1s linear infinite; }
      @keyframes flowBeam { to { stroke-dashoffset: -16; } }

      .badge { font-family: -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 12px; fill: #FFFFFF; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="700" fill="url(#bgGrad)" />
  <circle cx="200" cy="150" r="150" class="bg-blob" />
  <circle cx="800" cy="550" r="150" class="bg-blob-pink" />
  <circle cx="500" cy="350" r="200" class="bg-blob" />

  <!-- Connector Beams (Arrows) -->
  <!-- Mobile -> Django -->
  <path d="M 175 230 L 175 270" class="beam" marker-end="url(#arrowhead)" />
  
  <!-- Django -> Gemini -->
  <path d="M 500 280 L 500 240" class="beam" marker-end="url(#arrowhead)" />
  
  <!-- Gemini -> Django -->
  <path d="M 800 230 L 800 270" class="beam" marker-end="url(#arrowhead)" />
  
  <!-- Django -> SMTP -->
  <path d="M 250 460 L 250 500" class="beam" marker-end="url(#arrowhead)" />
  
  <!-- SMTP -> Recruiter -->
  <path d="M 450 590 L 520 590" class="beam" marker-end="url(#arrowhead)" />

  <!-- Bento Cards Layer -->

  <!-- 1. Mobile App -->
  <g transform="translate(50, 50)">
    <rect width="250" height="180" class="glass-card" />
    <rect x="20" y="20" width="30" height="30" rx="8" fill="#3B82F6" />
    <text x="35" y="40" text-anchor="middle" class="badge">1</text>
    <text x="20" y="85" class="title">Mobile App</text>
    <text x="20" y="110" class="subtitle">React Native</text>
    <text x="20" y="140" class="desc">Form Entered:</text>
    <text x="20" y="160" class="desc">Company &amp; Job Description</text>
  </g>

  <!-- 3. Gemini LLM -->
  <g transform="translate(350, 50)">
    <rect width="600" height="180" class="glass-card" />
    <rect x="20" y="20" width="30" height="30" rx="8" fill="#EC4899" />
    <text x="35" y="40" text-anchor="middle" class="badge">3</text>
    <text x="20" y="85" class="title">Google Gemini LLM</text>
    <text x="20" y="110" class="subtitle">Artificial Intelligence Engine</text>
    <text x="20" y="140" class="desc">Processes contextual prompt. Generates a hyper-personalized</text>
    <text x="20" y="160" class="desc">and professional cover letter pitch tailored to the candidate.</text>
  </g>

  <!-- 2. Django API -->
  <g transform="translate(50, 280)">
    <rect width="900" height="180" class="glass-card" />
    <rect x="20" y="20" width="30" height="30" rx="8" fill="#8B5CF6" />
    <text x="35" y="40" text-anchor="middle" class="badge">2</text>
    <text x="20" y="85" class="title">Django REST API</text>
    <text x="20" y="110" class="subtitle">Core Orchestration Server</text>
    <text x="20" y="140" class="desc">Receives payload. Appends user's saved Tech Stack and Experience level.</text>
    <text x="20" y="160" class="desc">Routes enriched payload to AI, then routes result to background email thread.</text>
  </g>

  <!-- 4. Gmail SMTP -->
  <g transform="translate(50, 510)">
    <rect width="400" height="150" class="glass-card" />
    <rect x="20" y="20" width="30" height="30" rx="8" fill="#10B981" />
    <text x="35" y="40" text-anchor="middle" class="badge">4</text>
    <text x="20" y="85" class="title">Gmail SMTP Thread</text>
    <text x="20" y="110" class="subtitle">Background Dispatcher</text>
    <text x="20" y="140" class="desc">Wraps AI text in stylish HTML Theme.</text>
  </g>

  <!-- 5. Recruiter Inbox -->
  <g transform="translate(540, 510)">
    <rect width="410" height="150" class="glass-card" />
    <rect x="20" y="20" width="30" height="30" rx="8" fill="#F59E0B" />
    <text x="35" y="40" text-anchor="middle" class="badge">5</text>
    <text x="20" y="85" class="title">Recruiter Inbox</text>
    <text x="20" y="110" class="subtitle">Final Destination</text>
    <text x="20" y="140" class="desc">Email delivered flawlessly!</text>
  </g>

</svg>
