<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Glowing Path Gradient -->
    <linearGradient id="pathGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    
    <linearGradient id="aiGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="emailGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 26px; fill: #F8FAFC; letter-spacing: 1px; }
      .text-node { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 16px; fill: #F1F5F9; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #94A3B8; }
      
      .box { fill: #1E293B; stroke: #334155; stroke-width: 2; rx: 12; transition: all 0.3s; }
      
      .flow-line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 8; animation: moveFlow 1s linear infinite; }
      @keyframes moveFlow { to { stroke-dashoffset: -16; } }

      .pulse { animation: pulseGlow 2s infinite alternate; }
      @keyframes pulseGlow {
        0% { opacity: 0.7; transform: scale(0.98); }
        100% { opacity: 1; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg)" rx="16" />

  <!-- Title -->
  <text x="450" y="60" text-anchor="middle" class="text-title" filter="url(#glow)">PROREACH AUTOMATED WORKFLOW</text>
  <text x="450" y="85" text-anchor="middle" class="text-desc">Seamless integration from Mobile to AI to Recruiter Inbox</text>

  <!-- Paths -->
  <!-- App to Backend -->
  <path d="M 220 250 L 380 250" class="flow-line" stroke="url(#pathGradient)" filter="url(#glow)" />
  <!-- Backend to Gemini AI -->
  <path d="M 450 190 L 450 140" class="flow-line" stroke="url(#aiGradient)" filter="url(#glow)" />
  <!-- Backend to Gmail -->
  <path d="M 450 310 L 450 360" class="flow-line" stroke="url(#emailGradient)" filter="url(#glow)" />
  <!-- Backend to Recruiter -->
  <path d="M 520 250 L 680 250" class="flow-line" stroke="url(#emailGradient)" filter="url(#glow)" />

  <!-- Nodes -->
  <!-- 1. Mobile App (Left) -->
  <g transform="translate(80, 190)">
    <rect width="140" height="120" class="box" />
    <circle cx="70" cy="40" r="15" fill="#38BDF8" class="pulse" filter="url(#glow)" />
    <text x="70" y="75" text-anchor="middle" class="text-node">React Native</text>
    <text x="70" y="95" text-anchor="middle" class="text-desc">User Input &amp; UI</text>
  </g>

  <!-- 2. Django API (Center) -->
  <g transform="translate(380, 190)">
    <rect width="140" height="120" class="box" stroke="#818CF8" />
    <circle cx="70" cy="40" r="15" fill="#818CF8" class="pulse" filter="url(#glow)" />
    <text x="70" y="75" text-anchor="middle" class="text-node">Django API</text>
    <text x="70" y="95" text-anchor="middle" class="text-desc">Orchestration</text>
  </g>

  <!-- 3. Google Gemini (Top Center) -->
  <g transform="translate(380, 20)">
    <rect width="140" height="120" class="box" stroke="#F472B6" />
    <circle cx="70" cy="40" r="15" fill="#F472B6" class="pulse" filter="url(#glow)" />
    <text x="70" y="75" text-anchor="middle" class="text-node">Gemini LLM</text>
    <text x="70" y="95" text-anchor="middle" class="text-desc">AI Pitch Generation</text>
  </g>

  <!-- 4. Gmail SMTP (Bottom Center) -->
  <g transform="translate(380, 360)">
    <rect width="140" height="120" class="box" stroke="#34D399" />
    <circle cx="70" cy="40" r="15" fill="#34D399" class="pulse" filter="url(#glow)" />
    <text x="70" y="75" text-anchor="middle" class="text-node">Gmail SMTP</text>
    <text x="70" y="95" text-anchor="middle" class="text-desc">Background Thread</text>
  </g>

  <!-- 5. Recruiter Inbox (Right) -->
  <g transform="translate(680, 190)">
    <rect width="140" height="120" class="box" />
    <circle cx="70" cy="40" r="15" fill="#10B981" class="pulse" filter="url(#glow)" />
    <text x="70" y="75" text-anchor="middle" class="text-node">Recruiter</text>
    <text x="70" y="95" text-anchor="middle" class="text-desc">Target Inbox</text>
  </g>

  <!-- Floating badges for steps -->
  <g transform="translate(250, 220)">
    <rect width="100" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <text x="50" y="16" text-anchor="middle" class="text-desc" fill="#38BDF8">1. Job Details</text>
  </g>
  <g transform="translate(480, 150)">
    <rect width="120" height="24" rx="12" fill="#0F172A" stroke="#F472B6" stroke-width="1" />
    <text x="60" y="16" text-anchor="middle" class="text-desc" fill="#F472B6">2. Request Pitch</text>
  </g>
  <g transform="translate(290, 150)">
    <rect width="120" height="24" rx="12" fill="#0F172A" stroke="#C084FC" stroke-width="1" />
    <text x="60" y="16" text-anchor="middle" class="text-desc" fill="#C084FC">3. Return Draft</text>
  </g>
  <g transform="translate(250, 270)">
    <rect width="100" height="24" rx="12" fill="#0F172A" stroke="#34D399" stroke-width="1" />
    <text x="50" y="16" text-anchor="middle" class="text-desc" fill="#34D399">4. Dispatch</text>
  </g>
  <g transform="translate(540, 220)">
    <rect width="120" height="24" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <text x="60" y="16" text-anchor="middle" class="text-desc" fill="#10B981">5. HTML Email Sent</text>
  </g>

</svg>
