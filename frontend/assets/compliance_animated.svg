<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="450">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#302b63" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>
    <linearGradient id="orangeCyber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .cyber-text { font-family: 'Courier New', monospace; font-weight: bold; fill: #ffffff; }
      .cyber-title { font-family: 'Arial', sans-serif; font-weight: 900; fill: url(#orangeCyber); font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
      .pulse { animation: pulsing 2s infinite alternate; }
      @keyframes pulsing {
        0% { opacity: 0.6; filter: drop-shadow(0 0 5px #FF4B2B); }
        100% { opacity: 1; filter: drop-shadow(0 0 20px #FF4B2B); }
      }
      .data-flow { stroke-dasharray: 10; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      .glitch { animation: glitching 3s infinite; }
      @keyframes glitching {
        0%, 95% { transform: translate(0, 0); }
        96% { transform: translate(-2px, 2px); }
        97% { transform: translate(2px, -2px); }
        98% { transform: translate(-2px, -2px); }
        99% { transform: translate(2px, 2px); }
        100% { transform: translate(0, 0); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradient)" rx="15" />
  
  <!-- Grid Lines for Cyberpunk Feel -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" class="cyber-title glitch" filter="url(#neonGlow)">PLAY STORE COMPLIANCE PROTOCOL</text>
  
  <!-- Data Flow Lines -->
  <path d="M 150 200 L 400 200" stroke="url(#orangeCyber)" stroke-width="3" fill="none" class="data-flow" filter="url(#neonGlow)" />
  <path d="M 400 200 L 650 200" stroke="url(#orangeCyber)" stroke-width="3" fill="none" class="data-flow" filter="url(#neonGlow)" />
  <path d="M 400 200 L 400 320" stroke="url(#orangeCyber)" stroke-width="3" fill="none" class="data-flow" filter="url(#neonGlow)" />

  <!-- Device (Left) -->
  <g transform="translate(100, 150)">
    <rect x="-30" y="-50" width="60" height="100" rx="8" fill="#1e1e1e" stroke="#FF416C" stroke-width="3" filter="url(#neonGlow)" />
    <rect x="-24" y="-40" width="48" height="70" fill="#000000" />
    <circle cx="0" cy="40" r="4" fill="#FF4B2B" class="pulse" />
    <text x="0" y="75" text-anchor="middle" class="cyber-text" font-size="14">Mobile App</text>
    <text x="0" y="95" text-anchor="middle" class="cyber-text" font-size="10" fill="#aaaaaa">Policy &amp; Terms</text>
  </g>

  <!-- Server (Center) -->
  <g transform="translate(400, 150)">
    <rect x="-50" y="-60" width="100" height="120" rx="10" fill="#1e1e1e" stroke="url(#orangeCyber)" stroke-width="4" filter="url(#neonGlow)" class="pulse" />
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#FF4B2B" stroke-width="4" />
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#FF4B2B" stroke-width="4" />
    <line x1="-30" y1="30" x2="30" y2="30" stroke="#FF4B2B" stroke-width="4" />
    <text x="0" y="85" text-anchor="middle" class="cyber-text" font-size="14">Django API</text>
    <text x="0" y="105" text-anchor="middle" class="cyber-text" font-size="10" fill="#aaaaaa">Delete Endpoint</text>
  </g>

  <!-- Google Play Shield (Right) -->
  <g transform="translate(650, 150)">
    <path d="M-30,-40 L30,-40 L40,0 L0,50 L-40,0 Z" fill="#1e1e1e" stroke="#34D399" stroke-width="4" filter="url(#neonGlow)" />
    <text x="0" y="5" text-anchor="middle" font-size="20">🛡️</text>
    <text x="0" y="75" text-anchor="middle" class="cyber-text" font-size="14">Google Play</text>
    <text x="0" y="95" text-anchor="middle" class="cyber-text" font-size="10" fill="#34D399">Verified Safe</text>
  </g>

  <!-- Database (Bottom Center) -->
  <g transform="translate(400, 360)">
    <ellipse cx="0" cy="-20" rx="40" ry="15" fill="#1e1e1e" stroke="#FF4B2B" stroke-width="3" filter="url(#neonGlow)" />
    <path d="M-40,-20 L-40,20 A40,15 0 0,0 40,20 L40,-20" fill="#1e1e1e" stroke="#FF4B2B" stroke-width="3" filter="url(#neonGlow)" />
    <text x="0" y="45" text-anchor="middle" class="cyber-text" font-size="14">PostgreSQL DB</text>
    <text x="0" y="65" text-anchor="middle" class="cyber-text" font-size="10" fill="#FF416C">Total Wipe API</text>
  </g>
  
  <!-- Info Badges -->
  <g transform="translate(40, 380)">
    <rect width="180" height="40" rx="5" fill="#000" stroke="#FF416C" stroke-width="2" />
    <text x="90" y="25" text-anchor="middle" class="cyber-text" font-size="12">1. Privacy Policy Link</text>
  </g>
  <g transform="translate(580, 380)">
    <rect width="180" height="40" rx="5" fill="#000" stroke="#FF4B2B" stroke-width="2" />
    <text x="90" y="25" text-anchor="middle" class="cyber-text" font-size="12">2. GDPR Data Wipe</text>
  </g>

</svg>
