<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 600" width="100%" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Glass Effect -->
    <filter id="glassBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    
    <style>
      .app-bg { fill: url(#bgGrad); }
      .sidebar { fill: rgba(255, 255, 255, 0.03); stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; }
      .glass-card { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; rx: 16; filter: url(#glassBlur); }
      .input-field { fill: rgba(0, 0, 0, 0.3); stroke: rgba(255, 255, 255, 0.1); rx: 8; }
      
      .text-title { font-family: -apple-system, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .text-logo { font-family: -apple-system, sans-serif; font-weight: 900; font-size: 24px; fill: url(#primaryGradient); letter-spacing: -1px; }
      .text-menu { font-family: -apple-system, sans-serif; font-weight: 500; font-size: 15px; fill: #cbd5e1; }
      .text-menu-active { font-family: -apple-system, sans-serif; font-weight: 600; font-size: 15px; fill: #ffffff; }
      
      .btn { fill: url(#primaryGradient); rx: 8; transition: opacity 0.3s; }
      .btn-text { font-family: -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #ffffff; }

      .qr-bg { fill: #ffffff; rx: 8; }
      .qr-block { fill: #000000; }
      
      .icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.75; }
    </style>
  </defs>

  <!-- Browser Window Frame -->
  <rect width="950" height="600" rx="12" fill="#000000" />
  <!-- Browser Dots -->
  <circle cx="25" cy="20" r="6" fill="#ef4444" />
  <circle cx="45" cy="20" r="6" fill="#eab308" />
  <circle cx="65" cy="20" r="6" fill="#22c55e" />
  <rect x="0" y="40" width="950" height="560" class="app-bg" />

  <!-- Decorative blur blobs -->
  <circle cx="850" cy="150" r="100" fill="#8b5cf6" opacity="0.15" filter="blur(50px)" />
  <circle cx="300" cy="450" r="150" fill="#3b82f6" opacity="0.1" filter="blur(70px)" />

  <!-- Sidebar -->
  <rect x="0" y="40" width="220" height="560" class="sidebar" />
  <text x="30" y="90" class="text-logo">ProReach</text>
  <text x="30" y="110" font-size="11" fill="#64748b" font-family="sans-serif">WEB DASHBOARD</text>
  
  <!-- Menu Items -->
  <rect x="20" y="140" width="180" height="40" rx="8" fill="rgba(255,255,255,0.08)" />
  <!-- Sparkle Icon -->
  <path d="M 35 160 L 37 155 L 42 153 L 37 151 L 35 146 L 33 151 L 28 153 L 33 155 Z M 44 162 L 45 159 L 48 158 L 45 157 L 44 154 L 43 157 L 40 158 L 43 159 Z" fill="#fff" />
  <text x="55" y="165" class="text-menu-active">New Pitch</text>
  
  <!-- Bar Chart Icon -->
  <path d="M 30 220 L 30 205 M 36 220 L 36 200 M 42 220 L 42 210 M 26 220 L 46 220" class="icon" stroke="#cbd5e1" />
  <text x="55" y="215" class="text-menu">Pitch History</text>
  
  <!-- Paperclip Icon -->
  <path d="M 38 252 A 4 4 0 0 0 32 252 L 28 256 A 6 6 0 0 0 36 264 L 42 258 A 4 4 0 0 0 36 252 L 32 256" class="icon" stroke="#cbd5e1" />
  <text x="55" y="265" class="text-menu">Resume Manager</text>
  
  <!-- Gear Icon -->
  <path d="M 35 306 A 4 4 0 1 0 35 314 A 4 4 0 1 0 35 306 M 35 302 L 35 304 M 35 316 L 35 318 M 30 310 L 32 310 M 38 310 L 40 310 M 31 306 L 32 307 M 38 313 L 39 314 M 31 314 L 32 313 M 38 307 L 39 306" class="icon" stroke="#cbd5e1" />
  <text x="55" y="315" class="text-menu">Settings</text>
  
  <!-- Sync Device Button -->
  <rect x="20" y="520" width="180" height="60" rx="8" fill="rgba(59, 130, 246, 0.1)" stroke="#3b82f6" stroke-width="1" />
  <!-- Phone Icon -->
  <rect x="30" y="533" width="10" height="16" rx="2" class="icon" stroke="#3b82f6" />
  <line x1="33" y1="546" x2="37" y2="546" stroke="#3b82f6" stroke-width="1" />
  <text x="50" y="545" class="text-menu-active" fill="#3b82f6">Sync Device</text>
  <text x="50" y="565" font-size="11" fill="#60a5fa" font-family="sans-serif">Connected to iOS</text>

  <!-- Main Content Area (Shifted to x=250) -->
  <text x="250" y="100" class="text-title">Generate AI Pitch</text>
  <text x="250" y="125" font-size="14" fill="#94a3b8" font-family="sans-serif">Let Gemini craft the perfect cover letter email.</text>

  <!-- Input Card (Width 380 to avoid overlap) -->
  <rect x="250" y="160" width="380" height="400" class="glass-card" />
  
  <!-- Form Elements -->
  <text x="280" y="200" class="text-menu">Target Company</text>
  <rect x="280" y="215" width="320" height="45" class="input-field" />
  <text x="295" y="243" font-size="14" fill="#cbd5e1" font-family="sans-serif">e.g. OpenAI</text>

  <text x="280" y="295" class="text-menu">Job Description</text>
  <rect x="280" y="310" width="320" height="150" class="input-field" />
  <text x="295" y="338" font-size="14" fill="#64748b" font-family="sans-serif">Paste the raw job description here...</text>

  <rect x="280" y="485" width="320" height="45" class="btn" />
  <!-- Paper Plane Icon -->
  <path d="M 495 500 L 510 507 L 495 514 L 498 507 Z" fill="#fff" />
  <text x="430" y="513" text-anchor="middle" class="btn-text">Generate &amp; Dispatch</text>

  <!-- Floating Sync Modal (Shifted to x=680, No Overlap!) -->
  <rect x="670" y="110" width="240" height="280" class="glass-card" />
  <text x="790" y="150" text-anchor="middle" class="text-menu-active">Link Mobile App</text>
  <text x="790" y="170" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif">Scan to sync UUID</text>
  
  <!-- Fake QR Code -->
  <g transform="translate(720, 190)">
    <rect width="140" height="140" class="qr-bg" />
    <!-- QR Corners -->
    <rect x="10" y="10" width="30" height="30" class="qr-block" />
    <rect x="15" y="15" width="20" height="20" fill="#fff" />
    <rect x="100" y="10" width="30" height="30" class="qr-block" />
    <rect x="105" y="15" width="20" height="20" fill="#fff" />
    <rect x="10" y="100" width="30" height="30" class="qr-block" />
    <rect x="15" y="105" width="20" height="20" fill="#fff" />
    <!-- Random Data -->
    <rect x="50" y="10" width="10" height="10" class="qr-block" />
    <rect x="70" y="10" width="20" height="10" class="qr-block" />
    <rect x="10" y="50" width="20" height="10" class="qr-block" />
    <rect x="40" y="40" width="40" height="40" class="qr-block" />
    <rect x="90" y="50" width="20" height="30" class="qr-block" />
    <rect x="120" y="50" width="10" height="40" class="qr-block" />
    <rect x="50" y="90" width="30" height="20" class="qr-block" />
    <rect x="90" y="90" width="10" height="10" class="qr-block" />
    <rect x="100" y="110" width="30" height="20" class="qr-block" />
    <rect x="50" y="120" width="40" height="10" class="qr-block" />
    <!-- Gradient overlay to make it look cool -->
    <rect width="140" height="140" fill="url(#primaryGradient)" style="mix-blend-mode: screen;" opacity="0.2"/>
  </g>
</svg>
